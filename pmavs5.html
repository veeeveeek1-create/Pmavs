header b{background:linear-gradient(90deg,#fff 0%,#2ee6a8 50%,#fff 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shn 5s linear infinite}

.row.me{transform-origin:right bottom}.row:not(.me){transform-origin:left bottom}
.act,.chip,.go,#send,.ib{transition:transform .15s}
.act:active,.chip:active,.go:active,#send:active,.ib:active{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

    const l=document.createElement("div");l.textContent=n===name?"You":n;d.append(a,l);s.appendChild(d);
  });
}

const rec={};
function show(m,key){
  const l=$("list"),e=l.querySelector(".empty");if(e)e.remove();
  const near=l.scrollHeight-l.scrollTop-l.clientHeight<160,day=dl(m.t);
  if(day!==ld2){const d=document.createElement("div");d.className="day";d.textContent=day;l.appendChild(d);ld2=day;lf=""}
  const me=m.from===name,cont=lf===m.from&&m.t-lt<3e5;
  const r=document.createElement("div");r.className="row"+(me?" me":"")+(cont?" cont":"");
  const b=document.createElement("div");b.className="b";
  if(!me&&!cont){const w=document.createElement("div");w.className="who";w.style.color=col(m.from);w.textContent=m.from;b.appendChild(w)}
  const body=document.createElement("div");b.appendChild(body);
  const mt=document.createElement("div");mt.className="m";
  const fill=()=>{
    body.innerHTML="";b.classList.remove("lock");
    if(m.card){const c=document.createElement("div");c.className="big";c.textContent=CARDS[m.card]||"";body.appendChild(c)}
    if(m.img){const i=document.createElement("img");i.src=m.img;i.onclick=()=>{$("bg").src=m.img;$("view").classList.add("on")};body.appendChild(i)}
    if(m.audio){const a=document.createElement("audio");a.controls=true;a.src=m.audio;body.appendChild(a)}
    if(m.text){const t=document.createElement("div");t.className="t";t.textContent=m.text;body.appendChild(t)}
    mt.textContent=(m.edited?"edited · ":"")+new Date(m.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+(me?"  ✓":"");
  };
  const lockUI=()=>{body.innerHTML="";b.classList.add("lock");const c=document.createElement("div");c.className="big";c.textContent="🔒 Time capsule";const s=document.createElement("small");s.textContent="Opens "+fmt(m.unlock);body.append(c,s)};
  if(m.unlock&&m.unlock>Date.now()){lockUI();locks.push(()=>{if(Date.now()>=m.unlock){fill();return true}})}else fill();
  b.appendChild(mt);r.appendChild(b);l.appendChild(r);lf=m.from;lt=m.t;
  if(me){let tm;b.ontouchstart=()=>{tm=setTimeout(()=>menu(key,m),450)};b.ontouchend=b.ontouchmove=()=>clearTimeout(tm);b.oncontextmenu=e=>{e.preventDefault();menu(key,m)}}
  rec[key]={r,upd:n=>{m=n;fill()}};
  if(m.card==="love"&&Date.now()-m.t<15e3)hearts();
  if(!me&&m.t>loadedAt)notify(m,cur);
  if(near||me)l.scrollTop=l.scrollHeight;
}
setInterval(()=>{locks=locks.filter(f=>!f())},20000);

function send(o){o.from=name;o.t=Date.now();ref.push(o).catch(()=>alert("Not sent. Check Wi-Fi."))}
function sendText(){const t=$("box").value.trim();if(!t)return;if(editKey){ref.child(editKey).update({text:t,edited:true});editKey=null;$("box").placeholder="Message"}else send({text:t});$("box").value="";$("box").style.height="auto"}
$("send").onclick=sendText;
$("box").oninput=e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px"};
$("view").onclick=()=>$("view").classList.remove("on");

$("more").onclick=()=>$("sheet").classList.toggle("on");
$("list").onclick=()=>$("sheet").classList.remove("on");
document.querySelectorAll(".act[data-c]").forEach(b=>b.onclick=()=>{send({card:b.dataset.c});$("sheet").classList.remove("on")});
$("cap").onclick=()=>$("lk").classList.toggle("on");
$("lock").onclick=()=>{
  const t=$("box").value.trim(),w=new Date($("when").value).getTime();
  if(!t||!w||w<=Date.now()){alert("Type a message first, then pick a future date and time.");return}
  send({text:t,unlock:w});$("box").value="";$("lk").classList.remove("on");$("sheet").classList.remove("on");
};
STS.forEach(s=>{const c=document.createElement("button");c.className="chip";c.textContent=s;c.onclick=()=>{pres.child(name).update({status:s});$("sheet").classList.remove("on")};$("sts").appendChild(c)});

$("pick").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const img=new Image(),r=new FileReader();
  r.onload=()=>img.src=r.result;
  img.onload=()=>{const s=Math.min(1,800/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);send({img:c.toDataURL("image/jpeg",.65)})};
  r.readAsDataURL(f);e.target.value="";
};

let mr=null,ch=[],tm=null;
$("mic").onclick=async()=>{
  if(mr&&mr.state==="recording"){mr.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    mr=new MediaRecorder(st,{audioBitsPerSecond:24000});ch=[];
    mr.ondataavailable=e=>ch.push(e.data);
    mr.onstop=()=>{clearTimeout(tm);$("mic").classList.remove("rec");st.getTracks().forEach(t=>t.stop());
      const fr=new FileReader();fr.onload=()=>send({audio:fr.result});fr.readAsDataURL(new Blob(ch,{type:mr.mimeType}))};
    mr.start();$("mic").classList.add("rec");tm=setTimeout(()=>mr.stop(),60000);
  }catch(e){alert("Microphone permission needed.")}
};

MEM.forEach(n=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=n;b.onclick=()=>{sel=n;document.querySelectorAll("#mc .chip").forEach(c=>c.classList.remove("sel"));b.classList.add("sel")};$("mc").appendChild(b)});
$("nu").onclick=()=>{newUser=!newUser;$("nu").textContent=newUser?"I already have a PIN":"First time? Set my PIN";$("enter").textContent=newUser?"Set PIN & enter":"Enter";$("err").textContent=""};
$("enter").onclick=async()=>{
  const pin=$("pin").value.trim();
  if(!sel){$("err").textContent="Pick who you are.";return}
  if(!/^\d{6}$/.test(pin)){$("err").textContent="PIN must be exactly 6 digits.";return}
  initAudio();const em=sel.toLowerCase()+"@pmavs.app",a=firebase.auth();
  try{newUser?await a.createUserWithEmailAndPassword(em,pin):await a.signInWithEmailAndPassword(em,pin)}
  catch(e){const c=e.code||"";$("err").textContent=c.includes("already")?"Already set up. Tap 'I already have a PIN'.":c.includes("credential")||c.includes("password")||c.includes("user-not")?"Wrong PIN. First time? Tap 'First time? Set my PIN'.":c.includes("not-allowed")?"Email sign-in is not enabled in Firebase.":c.includes("weak")?"PIN too weak, use 6 digits.":"Could not sign in ("+c+")"}
};
$("out").onclick=()=>{if(pres)pres.child(name).update({on:false});detach();cur="";firebase.auth().signOut()};

/* ===== sounds & notifications ===== */
function initAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}
["click","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}},{passive:true}));
function beep(f,d){if(!ac)return;try{if(ac.state==="suspended")ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function ring(on){clearInterval(rg);if(on){const f=()=>{beep(520,.35);setTimeout(()=>beep(660,.35),400);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}};f();rg=setInterval(f,2200)}}
function notify(m,k){
  beep(700,.12);try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
  if(!document.hidden||!("Notification" in window)||Notification.permission!=="granted")return;
  const body=m.unlock>Date.now()?"🔒 Time capsule":m.text||(m.img?"📷 Photo":m.audio?"🎙️ Voice note":CARDS[m.card]||"");
  navigator.serviceWorker.ready.then(r=>r.showNotification(m.from+(k&&k!=="fam"?" (private)":""),{body,icon:"icon-192.png",badge:"icon-192.png",tag:"pmavs",renotify:true})).catch(()=>{});
}

let mk=null,mm=null;
function menu(k,m){mk=k;mm=m;$("ed").style.display=m.text?"":"none";$("menu").classList.add("on")}
$("ed").onclick=()=>{editKey=mk;$("box").value=mm.text;$("box").placeholder="Editing… tap ➤ to save";$("box").focus();$("menu").classList.remove("on")};

/* ===== profile ===== */
const EM=["😀","😎","🥰","🦁","🐼","🌸","⚡","🔥"];
EM.forEach(e=>{const c=document.createElement("button");c.className="chip";c.textContent=e;c.onclick=()=>{emoSel=e;photoData="";paint($("pfa"),name);$("pfa").style.backgroundImage="";$("pfa").textContent=e};$("emo").appendChild(c)});
function openP(n){
  pfN=n;const me=n===name,v=prof[n]||{};paint($("pfa"),n);
  $("pfn").textContent=n;$("pfs").textContent=(v.on?"Online":v.seen?"Last seen "+fmt(v.seen):"")+(v.status?" · "+v.status:"");

$("pph").onclick=()=>$("pphf").click();
$("pphf").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const img=new Image(),r=new FileReader();
  r.onload=()=>img.src=r.result;
  img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=128;const s=Math.min(img.width,img.height);c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);photoData=c.toDataURL("image/jpeg",.7);emoSel="";const a=$("pfa");a.textContent="";a.style.backgroundImage="url("+photoData+")"};
  r.readAsDataURL(f);e.target.value="";
};
$("pcall").onclick=()=>{$("pf").classList.remove("on");startCall(pfN)};
$("list").addEventListener("click",()=>{["pf","menu"].forEach(i=>$(i).classList.remove("on"))});

/* ===== voice calls (WebRTC, free STUN) ===== */
const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"},{urls:["turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443","turn:openrelay.metered.ca:443?transport=tcp"],username:"openrelayproject",credential:"openrelayproject"}]};
async function mkPC(role){
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  pc=new RTCPeerConnection(ICE);
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.ontrack=e=>{$("ra").srcObject=e.streams[0];$("ra").muted=false;$("ra").volume=1;$("ra").play().catch(()=>{})};
  pc.onicecandidate=e=>{if(e.candidate&&cRef)cRef.child("ice_"+role).push(e.candidate.toJSON())};
  pc.onconnectionstatechange=()=>{const st=pc&&pc.connectionState;if(st==="connected"){ring(false);clearTimeout(callTO);$("cs").textContent="On call"}if(st==="failed"){$("cs").textContent="Could not connect. Network blocks calls.";setTimeout(endCall,2500)}if(st==="closed")endCall()};
}
async function startCall(to){
  if(pc)return;
  cRef=firebase.database().ref("rooms/"+room+"/calls/"+to);
  await cRef.remove();
  try{await mkPC("caller")}catch(e){alert("Microphone permission needed.");cRef=null;pc=null;return}
  const o=await pc.createOffer();await pc.setLocalDescription(o);
  await cRef.update({from:name,state:"ring",t:Date.now(),offer:{type:o.type,sdp:o.sdp}});
  $("cn").textContent=to;paint($("ca2"),to);$("cs").textContent="Calling…";$("cacc").style.display="none";$("call").classList.add("on");ring(true);
  cRef.child("answer").on("value",async s=>{const a=s.val();if(a&&pc&&!pc.currentRemoteDescription)await pc.setRemoteDescription(a)});
  cRef.child("ice_callee").on("child_added",s=>pc&&pc.addIceCandidate(s.val()).catch(()=>{}));
  cRef.child("state").on("value",s=>{if(s.val()==="end")endCall(true)});
  callTO=setTimeout(()=>{if(pc&&pc.connectionState!=="connected"){send({card:"miss"});endCall()}},40000);
}
async function accept(){
  if(!incoming||pc)return;ring(false);$("cacc").style.display="none";$("cs").textContent="Connecting…";
  cRef=firebase.database().ref("rooms/"+room+"/calls/"+name);
  try{await mkPC("callee")}catch(e){alert("Microphone permission needed.");endCall();return}
  await pc.setRemoteDescription(incoming.offer);
  const a=await pc.createAnswer();await pc.setLocalDescription(a);
  await cRef.update({answer:{type:a.type,sdp:a.sdp},state:"on"});
  cRef.child("ice_caller").on("child_added",s=>pc&&pc.addIceCandidate(s.val()).catch(()=>{}));
}
function endCall(remote){
  ring(false);clearTimeout(callTO);const c=cRef;
  if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;
  if(pc){pc.onconnectionstatechange=null;pc.close()}pc=null;
  if(c){c.off();if(!remote)c.update({state:"end"});setTimeout(()=>c.remove(),4000)}
  cRef=null;incoming=null;$("call").classList.remove("on");
}
$("cacc").onclick=accept;
$("cend").onclick=()=>{
  if(incoming&&!pc){firebase.database().ref("rooms/"+room+"/calls/"+name).update({state:"end"});incoming=null;ring(false);$("call").classList.remove("on");return}
  endCall();
};
firebase.auth().onAuthStateChanged(u=>{
  const n=u&&u.email?u.email.split("@")[0]:"";name=MEM.find(m=>m.toLowerCase()===n)||"";
  if(name){start()}else{["home","chat"].forEach(i=>$(i).classList.remove("on"));$("login").classList.add("on")}
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
