<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>PMAVS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b0f14;--pn:#121820;--ln:#1d2733;--in:#18212b;--g1:#12b886;--g2:#0a8f6a;--tx:#e8eef4;--mu:#7f8d9b;--ac:#2ee6a8;--gold:#f5c76b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#login,#chat{position:fixed;inset:0;display:none;flex-direction:column}
#login.on,#chat.on{display:flex}
#login{justify-content:center;align-items:center;padding:28px;background:radial-gradient(120% 70% at 50% 0%,#12372f,var(--bg) 60%)}
.card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.logo{width:76px;height:76px;border-radius:26px;background:linear-gradient(145deg,var(--g1),#0b6e87);display:grid;place-items:center;font-weight:800;font-size:30px;box-shadow:0 14px 40px #12b88650}
.card h1{font-size:36px}.card p{color:var(--mu);margin-top:-6px}
.fld{background:var(--pn);border:1.5px solid var(--ln);border-radius:16px;padding:15px 16px;font-size:17px;color:var(--tx);width:100%}
.fld:focus{outline:none;border-color:var(--ac)}
.go{border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:700;color:#04251c;background:linear-gradient(135deg,var(--ac),var(--g1))}
.err{color:#ff7b7b;font-size:14px;min-height:18px}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px;background:var(--pn)}
header b{font-size:19px;flex:1}
#out{background:none;border:1px solid var(--ln);color:var(--mu);border-radius:14px;padding:6px 12px;font-size:12.5px}
#strip{display:flex;gap:14px;overflow-x:auto;padding:4px 14px 12px;background:var(--pn);border-bottom:1px solid var(--ln);scrollbar-width:none}
.mem{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--mu);flex:none;min-width:54px}
.ava{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;color:#04251c;border:2.5px solid var(--ln)}
.mem.on .ava{border-color:var(--ac);box-shadow:0 0 14px #2ee6a855}
.st{position:absolute;right:-6px;bottom:-4px;background:var(--bg);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px}
#list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:2px;background-image:radial-gradient(circle at 15% 10%,#12372f30,transparent 40%),radial-gradient(circle at 90% 85%,#0b6e8730,transparent 40%)}
.day{align-self:center;background:var(--pn);border:1px solid var(--ln);color:var(--mu);font-size:12px;padding:4px 12px;border-radius:12px;margin:10px 0 6px}
.empty{margin:auto;color:var(--mu);text-align:center;line-height:1.5}
.row{display:flex;flex-direction:column;max-width:80%;align-self:flex-start;margin-top:6px}
.row.cont{margin-top:1px}.row.me{align-self:flex-end;align-items:flex-end}
.b{padding:7px 11px 5px;border-radius:16px;background:var(--in);word-wrap:break-word;box-shadow:0 1px 2px #0006}
.row:not(.cont):not(.me) .b{border-top-left-radius:4px}
.row.me .b{background:linear-gradient(145deg,var(--g1),var(--g2));color:#fff}
.row.me:not(.cont) .b{border-top-right-radius:4px}
.who{font-size:12.5px;font-weight:700;margin-bottom:2px}
.t{font-size:15.5px;line-height:1.38;white-space:pre-wrap}
.b img{display:block;max-width:100%;max-height:340px;border-radius:12px;margin:2px 0 3px}
.b audio{height:38px;max-width:230px;margin:2px 0}
.big{font-size:17px;font-weight:700;padding:6px 4px}
.lock{border:1.5px dashed var(--gold);background:#f5c76b14!important;color:var(--gold)}
.lock small{display:block;opacity:.85;margin-top:2px}
.m{text-align:right;font-size:10.5px;opacity:.7;margin-top:2px}
#bar{display:flex;gap:8px;align-items:flex-end;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--pn);border-top:1px solid var(--ln)}
.iw{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--in);border-radius:24px;padding:2px 4px 2px 6px;border:1px solid var(--ln)}
#box{flex:1;min-width:0;width:100%;background:none;border:0;color:var(--tx);font:inherit;font-size:16px;padding:11px 8px;resize:none;max-height:120px;outline:none;line-height:1.3}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:none;color:var(--mu);font-size:21px;flex:none}
.ib.rec{background:#e5484d;color:#fff;animation:p 1s infinite}
@keyframes p{50%{opacity:.5}}
#send{width:48px;height:48px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--g1));color:#04251c;font-size:20px;flex:none}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--pn);border-top:1px solid var(--ln);border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s;z-index:8;display:flex;flex-direction:column;gap:12px}
#sheet.on{transform:none}
.sh{font-size:12.5px;color:var(--mu)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{background:var(--in);border:1px solid var(--ln);color:var(--tx);border-radius:16px;padding:14px;font-size:15px;font-weight:600;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--in);border:1px solid var(--ln);color:var(--tx);border-radius:20px;padding:8px 13px;font-size:14px}
#lk{display:none;gap:8px}#lk.on{display:flex}#lk input{flex:1;color-scheme:dark}
#view{position:fixed;inset:0;background:#000e;display:none;place-items:center;z-index:9}
#view.on{display:grid}#view img{max-width:96%;max-height:92%;border-radius:8px}
.h{position:fixed;bottom:-40px;font-size:30px;pointer-events:none;z-index:10;animation:up 2.8s ease-out forwards}
@keyframes up{to{transform:translateY(-105vh) rotate(25deg);opacity:0}}
</style></head><body>

<div id="login"><div class="card">
<div class="logo">PM</div><h1>PMAVS</h1><p>Our family. Our app.</p>
<input class="fld" id="nm" placeholder="Your name" autocomplete="off">
<input class="fld" id="cd" placeholder="Family code" autocomplete="off" autocapitalize="off">
<div class="err" id="err"></div><button class="go" id="enter">Continue</button></div></div>

<div id="chat">
<header><b>PMAVS</b><button id="out">Switch</button></header>
<div id="strip"></div>
<div id="list"><div class="empty">No messages yet.<br>Send the first one.</div></div>
<div id="bar">
<button class="ib" id="more" aria-label="More">⚡</button>
<div class="iw"><textarea id="box" rows="1" placeholder="Message"></textarea>
<button class="ib" id="pick">📷</button><input type="file" id="file" accept="image/*" hidden></div>
<button class="ib" id="mic">🎙️</button>
<button id="send">➤</button></div>
<div id="sheet">
<div class="sh">Quick send</div>
<div class="acts"><button class="act" data-c="home">🏠 Reached home</button><button class="act" data-c="call">📞 Call me</button>
<button class="act" data-c="love">❤️ Miss you</button><button class="act" id="cap">⏳ Time capsule</button></div>
<div id="lk"><input class="fld" type="datetime-local" id="when"><button class="go" id="lock">Lock</button></div>
<div class="sh">My status (everyone sees it)</div><div class="chips" id="sts"></div>
</div></div>
<div id="view"><img id="bg"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyDO0i4H6Y79yHRbdA6Rmf4T5hTmbJG86Bc",authDomain:"pmavs1.firebaseapp.com",databaseURL:"https://pmavs1-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"pmavs1",appId:"1:11496181971:web:70be8d1c2b9cd91bca0426"};
const $=id=>document.getElementById(id);
const sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},ld=k=>{try{return localStorage.getItem(k)||""}catch(e){return""}};
let name="",room="",ref=null,pres=null,lf="",ld2="",lt=0,locks=[];
try{firebase.initializeApp(cfg)}catch(e){}
const COL=["#ff9f6b","#6bc7ff","#c79bff","#ffd36b","#ff7eb6","#7be0a0"];
const col=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return COL[h%6]};
const STS=["🏠 At home","📚 Studying","🍽️ Eating","😴 Sleeping","🚗 Out","📞 Free to talk"];
const CARDS={home:"🏠 Reached home safely",call:"📞 Please call me",love:"❤️ Miss you"};
const dl=t=>{const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?"Today":d.toDateString()===new Date(Date.now()-864e5).toDateString()?"Yesterday":d.toLocaleDateString([],{day:"numeric",month:"short",year:"numeric"})};
const fmt=t=>new Date(t).toLocaleString([],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});

function hearts(){for(let i=0;i<22;i++){const h=document.createElement("div");h.className="h";h.textContent=["❤️","💚","💛","💖"][i%4];h.style.left=Math.random()*92+"%";h.style.animationDelay=Math.random()*.9+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),3800)}}

function start(){
  $("login").classList.remove("on");$("chat").classList.add("on");
  $("list").innerHTML='<div class="empty">No messages yet.<br>Send the first one.</div>';lf="";ld2="";locks=[];
  const db=firebase.database();
  ref=db.ref("rooms/"+room+"/messages");ref.off();
  ref.limitToLast(200).on("child_added",s=>show(s.val()));
  pres=db.ref("rooms/"+room+"/presence");pres.off();
  const me=pres.child(name);
  db.ref(".info/connected").on("value",s=>{if(s.val()){me.onDisconnect().update({on:false,seen:Date.now()});me.update({on:true,seen:Date.now()})}});
  pres.on("value",s=>strip(s.val()||{}));
}
function strip(p){
  const s=$("strip");s.innerHTML="";
  Object.keys(p).sort().forEach(n=>{
    const v=p[n],d=document.createElement("div");d.className="mem"+(v.on?" on":"");
    const a=document.createElement("div");a.className="ava";a.style.background=col(n);a.textContent=n[0].toUpperCase();
    if(v.status){const e=document.createElement("div");e.className="st";e.textContent=v.status.split(" ")[0];a.appendChild(e)}
    const l=document.createElement("div");l.textContent=n===name?"You":n;d.append(a,l);s.appendChild(d);
  });
}

function show(m){
  const l=$("list"),e=l.querySelector(".empty");if(e)e.remove();
  const near=l.scrollHeight-l.scrollTop-l.clientHeight<160,day=dl(m.t);
  if(day!==ld2){const d=document.createElement("div");d.className="day";d.textContent=day;l.appendChild(d);ld2=day;lf=""}
  const me=m.from===name,cont=lf===m.from&&m.t-lt<3e5;
  const r=document.createElement("div");r.className="row"+(me?" me":"")+(cont?" cont":"");
  const b=document.createElement("div");b.className="b";
  if(!me&&!cont){const w=document.createElement("div");w.className="who";w.style.color=col(m.from);w.textContent=m.from;b.appendChild(w)}
  const body=document.createElement("div");b.appendChild(body);
  const fill=()=>{
    body.innerHTML="";b.classList.remove("lock");
    if(m.card){const c=document.createElement("div");c.className="big";c.textContent=CARDS[m.card]||"";body.appendChild(c)}
    if(m.img){const i=document.createElement("img");i.src=m.img;i.onclick=()=>{$("bg").src=m.img;$("view").classList.add("on")};body.appendChild(i)}
    if(m.audio){const a=document.createElement("audio");a.controls=true;a.src=m.audio;body.appendChild(a)}
    if(m.text){const t=document.createElement("div");t.className="t";t.textContent=m.text;body.appendChild(t)}
  };
  const lockUI=()=>{body.innerHTML="";b.classList.add("lock");const c=document.createElement("div");c.className="big";c.textContent="🔒 Time capsule";const s=document.createElement("small");s.textContent="Opens "+fmt(m.unlock);body.append(c,s)};
  if(m.unlock&&m.unlock>Date.now()){lockUI();locks.push(()=>{if(Date.now()>=m.unlock){fill();return true}})}else fill();
  const mt=document.createElement("div");mt.className="m";mt.textContent=new Date(m.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+(me?"  ✓":"");
  b.appendChild(mt);r.appendChild(b);l.appendChild(r);lf=m.from;lt=m.t;
  if(m.card==="love"&&Date.now()-m.t<15e3)hearts();
  if(near||me)l.scrollTop=l.scrollHeight;
}
setInterval(()=>{locks=locks.filter(f=>!f())},20000);

function send(o){o.from=name;o.t=Date.now();ref.push(o).catch(()=>alert("Not sent. Check Wi-Fi."))}
function sendText(){const t=$("box").value.trim();if(!t)return;send({text:t});$("box").value="";$("box").style.height="auto"}
$("send").onclick=sendText;
$("box").oninput=e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px"};
$("view").onclick=()=>$("view").classList.remove("on");

$("more").onclick=()=>$("sheet").classList.toggle("on");
$("list").onclick=()=>$("sheet").classList.remove("on");
document.querySelectorAll(".act[data-c]").forEach(b=>b.onclick=()=>{send({card:b.dataset.c});$("sheet").classList.remove("on")});
$("cap").onclick=()=>$("lk").classList.toggle("on");
$("lock").onclick=()=>{
  const t=$("box").value.trim(),w=new Date($("when").value).getTime();
  if(!t||!w||w<=Date.now()){alert("Type a message first, then pick a future date and time.");return}
  send({text:t,unlock:w});$("box").value="";$("lk").classList.remove("on");$("sheet").classList.remove("on");
};
STS.forEach(s=>{const c=document.createElement("button");c.className="chip";c.textContent=s;c.onclick=()=>{pres.child(name).update({status:s});$("sheet").classList.remove("on")};$("sts").appendChild(c)});

$("pick").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const img=new Image(),r=new FileReader();
  r.onload=()=>img.src=r.result;
  img.onload=()=>{const s=Math.min(1,800/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);send({img:c.toDataURL("image/jpeg",.65)})};
  r.readAsDataURL(f);e.target.value="";
};

let mr=null,ch=[],tm=null;
$("mic").onclick=async()=>{
  if(mr&&mr.state==="recording"){mr.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    mr=new MediaRecorder(st,{audioBitsPerSecond:24000});ch=[];
    mr.ondataavailable=e=>ch.push(e.data);
    mr.onstop=()=>{clearTimeout(tm);$("mic").classList.remove("rec");st.getTracks().forEach(t=>t.stop());
      const fr=new FileReader();fr.onload=()=>send({audio:fr.result});fr.readAsDataURL(new Blob(ch,{type:mr.mimeType}))};
    mr.start();$("mic").classList.add("rec");tm=setTimeout(()=>mr.stop(),60000);
  }catch(e){alert("Microphone permission needed.")}
};

$("enter").onclick=()=>{
  name=$("nm").value.trim();room=$("cd").value.trim().toLowerCase().replace(/[^a-z0-9]/g,"");
  if(!name){$("err").textContent="Enter your name.";return}
  if(room.length<4){$("err").textContent="Family code needs 4+ letters or numbers.";return}
  sv("fc_name",name);sv("fc_room",room);start();
};
$("out").onclick=()=>{if(ref)ref.off();if(pres)pres.child(name).update({on:false});sv("fc_name","");$("chat").classList.remove("on");$("login").classList.add("on")};
name=ld("fc_name");room=ld("fc_room");$("login").classList.add("on");if(name&&room)start();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
